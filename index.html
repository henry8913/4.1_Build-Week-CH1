<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotify Clone - Home</title>
  <meta name="description" content="Spotify Clone: ascolta le anteprime dei tuoi artisti preferiti, esplora album e scopri nuova musica.">
  <meta name="theme-color" content="#121212">

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Spotify Clone - Team 1">
  <meta property="og:description" content="Ascolta le anteprime dei tuoi artisti preferiti, esplora album e scopri nuova musica.">
  <meta property="og:image" content="https://4-1-build-week-ch-1.vercel.app/img/cover_c.jpg">
  <meta property="og:url" content="https://4-1-build-week-ch-1.vercel.app/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="it_IT">

  <!-- Canonical -->
  <link rel="canonical" href="https://4-1-build-week-ch-1.vercel.app/">

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Spotify Clone - Team 1">
  <meta name="twitter:description" content="Ascolta le anteprime dei tuoi artisti preferiti, esplora album e scopri nuova musica.">
  <meta name="twitter:image" content="https://4-1-build-week-ch-1.vercel.app/img/cover_c.jpg">

  <!-- favicon -->
  <link rel="icon" type="image/png" href="img/favicon.png">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link href="css/style.css?v=20261026-8" rel="stylesheet">
  <link href="css/player.css?v=20261026-8" rel="stylesheet">
</head>

<body data-page="home">
  <div class="app-shell">
    <div id="app-sidebar"></div>

    <main class="main-content" id="main-content">
      <div id="app-header"></div>

      <div id="content-area" class="p-4">
        <!-- Album in evidenza -->
        <section id="featured-album" class="mb-5" aria-label="Album in evidenza">
          <div class="featured-album-container">
            <div class="featured-album-bg"></div>
            <div class="row align-items-end g-4">
              <div class="col-12 col-md-4 col-lg-3">
                <img id="featured-album-img" src="img/cover_c.jpg" alt="Copertina album" class="featured-album-cover">
              </div>
              <div class="col-12 col-md-8 col-lg-9">
                <div class="featured-album-details">
                  <div class="album-type">IN EVIDENZA</div>
                  <h1 id="featured-album-title" class="mb-3">Caricamento...</h1>
                  <div id="featured-album-artist" class="mb-2">Caricamento...</div>
                  <p id="featured-album-description" class="mb-4">Ascolta il nuovo singolo!</p>
                  <div class="d-flex align-items-center">
                    <button type="button" id="featured-play" class="btn btn-success rounded-pill px-4 py-2 me-2">
                      <i class="bi bi-play-fill"></i> Play
                    </button>
                    <button type="button" id="featured-save" class="btn btn-dark rounded-pill px-4 py-2 me-2"
                      aria-pressed="false">
                      <i class="bi bi-plus-lg"></i> Salva
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Buonasera -->
        <div class="section-heading">
          <h2 id="greeting">Buonasera</h2>
        </div>
        <div class="row g-3 mb-5 track-container" id="recent-container">
          <!-- Ascolti recenti caricati via API -->
        </div>

        <!-- Altro di cio' che ti piace -->
        <div class="section-heading">
          <h2>Altro di cio&apos; che ti piace</h2>
          <a href="search.html?search=rock" class="see-more-link">Visualizza tutto</a>
        </div>
        <div class="row g-3 mb-5 track-container" id="album-list">
          <!-- Album caricati via API -->
        </div>

        <!-- In tendenza -->
        <div class="section-heading">
          <h2>In tendenza</h2>
          <a href="search.html?search=top%20hits" class="see-more-link">Visualizza tutto</a>
        </div>
        <div class="row g-3 track-container" id="trending-container">
          <!-- Brani in tendenza caricati via API -->
        </div>
      </div>
    </main>

    <div id="app-friends"></div>
  </div>

  <div id="app-player"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="js/utils.js?v=20261026-8"></script>
  <script src="js/music-api.js?v=20261026-8"></script>
  <script src="js/library.js?v=20261026-8"></script>
  <script src="js/layout.js?v=20261026-8"></script>
  <script src="js/player.js?v=20261026-8"></script>
  <script src="js/script.js?v=20261026-8"></script>
</body>

</html>
